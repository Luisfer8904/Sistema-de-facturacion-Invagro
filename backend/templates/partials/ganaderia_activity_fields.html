{% if activity_type_locked %}
  <input id="activityTypeInput" type="hidden" name="tipo" value="{{ selected_activity_type or '' }}" required />
{% else %}
  <label>Tipo<select name="tipo" required><option value="">Selecciona</option><option value="pesaje">Pesaje</option><option value="vacunacion">Vacunación</option><option value="desparasitacion">Desparasitación</option><option value="tratamiento">Tratamiento</option><option value="inseminacion">Inseminación</option><option value="palpacion">Palpación</option><option value="parto">Parto</option><option value="secado">Secado</option><option value="destete">Destete</option><option value="identificacion">Identificación</option><option value="visita">Visita veterinaria</option><option value="manejo">Manejo general</option></select></label>
{% endif %}
<label>Título<input name="titulo" placeholder="Descripción corta" /></label>
<div class="ganaderia-two-fields"><label>Fecha<input type="date" name="fecha" value="{{ today.isoformat() if today else '' }}" required /></label><label><span id="activityNextDateLabel">Próxima fecha</span><input id="activityNextDateInput" type="date" name="proxima_fecha" /><small class="ganaderia-field-hint" id="palpationDueHint" hidden>Se sugiere automáticamente si existe una inseminación registrada.</small></label></div>
<div class="ganaderia-two-fields"><label>Producto<input name="producto" /></label><label>Dosis<input name="dosis" /></label></div>
<div class="ganaderia-two-fields"><label>Peso (lb)<input type="number" step="0.01" min="0" name="peso" /></label>{% if activity_type_locked %}<label id="activityResultField">Resultado<input id="activityResultInput" name="resultado" /></label><label id="palpationResultField" hidden>Resultado de palpación<select id="palpationResultInput" name="resultado" disabled required><option value="">Selecciona</option><option value="prenada">Preñada</option><option value="vacia">Vacía</option><option value="dudosa">Dudosa</option></select></label>{% else %}<label>Resultado<input name="resultado" /></label>{% endif %}</div>
<label>Observaciones<textarea name="observaciones" rows="3"></textarea></label>
